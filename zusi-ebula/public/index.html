<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EBuLa">
<meta name="theme-color" content="#000000">
<title>EBuLa für Zusi 3</title>
<style>
:root {
  --frame: #26282c;
  --frame-edge: #141518;
  --pink: #e3a6ae;
  --key-bg: #111214;
  --key-txt: #f2f2f2;
  --scr-bg: #0a0a0c;
  --scr-fg: #f4f6f8;
  --scr-dim: #8b929a;
  --scr-line: #cfe2ee;
  --scr-past: #5d646b;
  --soft-bg: #9ba8b5;
  --soft-btn: #b9c4ce;
  --soft-txt: #29323a;
  --blue: #0000e6;
  --accent: #ffd23f;
  --halt-bg: rgba(255,255,255,.06);
  --marker: #ff3b30;
}
.day {
  --scr-bg: #f4f4ef;
  --scr-fg: #0b0b0b;
  --scr-dim: #5a5f66;
  --scr-line: #222;
  --scr-past: #9aa0a6;
  --halt-bg: rgba(0,0,0,.06);
  --accent: #b36b00;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #000;
  font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
#device {
  position: absolute; left: 50%; top: 50%; width: 1180px; height: 820px;
  transform-origin: 50% 50%;
  background: var(--frame); border-radius: 34px;
  box-shadow: inset 0 0 0 6px var(--frame-edge), 0 0 40px rgba(0,0,0,.6);
}
#outline { position: absolute; inset: 0; pointer-events: none; }
.led { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #3a3d42; box-shadow: inset 0 1px 2px #000; transition: background .08s; }
.led.on-g { background: #39e15a; box-shadow: 0 0 8px #39e15a; }
.led.on-y { background: #ffcc33; box-shadow: 0 0 8px #ffcc33; }
.led.on-r { background: #ff4d3d; box-shadow: 0 0 8px #ff4d3d; }
.ledlbl { position: absolute; font-size: 12px; font-weight: 700; color: #e9ecef; letter-spacing: .5px; }
#sensor { position: absolute; left: 34px; top: 236px; width: 12px; height: 26px; background: #6e7680; border-radius: 2px; }

.key {
  position: absolute; width: 56px; height: 54px; border: 2px solid var(--pink); border-radius: 9px;
  background: var(--key-bg); color: var(--key-txt); cursor: pointer; padding: 0;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.5), 0 2px 3px rgba(0,0,0,.4);
  font: 700 15px/1 "Helvetica Neue", Arial, sans-serif;
}
.key span { position: absolute; left: 7px; top: 6px; text-align: left; white-space: nowrap; }
.key.wide { width: 140px; }
.key:active, .key.pressed { transform: translateY(2px); box-shadow: inset 0 0 6px rgba(227,166,174,.6); }
.key svg { display: block; }

#screen {
  position: absolute; left: 150px; top: 92px; width: 950px; height: 624px; overflow: hidden;
  background: var(--scr-bg); color: var(--scr-fg); border: 3px solid #050506; border-radius: 3px;
}
#screen-inner { position: absolute; inset: 0; }
#blank { position: absolute; inset: 0; background: #000; display: none; z-index: 50; }
#dim { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 0; z-index: 40; }

/* Kopfzeile */
#hdr { position: absolute; left: 0; top: 0; width: 100%; height: 70px; border-bottom: 2px solid var(--scr-line); }
.hc { position: absolute; overflow: hidden; white-space: nowrap; display: flex; align-items: center; padding: 0 9px; }
.hc.a { top: 0; height: 44px; border-bottom: 1px solid var(--scr-line); }
.hc.b { top: 44px; height: 24px; font-size: 14px; color: var(--scr-dim); }
.hc + .hc { }
.vsep { border-left: 2px solid var(--scr-line); }
#h-zug { font-size: 22px; font-weight: 700; }
#h-lauf { font-size: 17px; }
#h-lauf small { color: var(--scr-dim); font-size: 13px; margin-right: 6px; }
#h-uhr { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; justify-content: center; }
#h-vsp { font-size: 22px; font-weight: 700; justify-content: center; font-variant-numeric: tabular-nums; }
#h-vsp.late { color: #ff5a4f; }
#h-vsp.early { color: #4cd964; }
.day #h-vsp.late { color: #c21807; }
.day #h-vsp.early { color: #138a2c; }
.hc.b b { color: var(--scr-fg); font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* Fahrplantabelle */
#tbl { position: absolute; left: 0; top: 70px; width: 100%; height: 458px; overflow: hidden; }
.col-line { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--scr-line); }
.col-line.thin { border-left-width: 1px; opacity: .45; }
.row { position: absolute; left: 0; width: 100%; font-variant-numeric: tabular-nums; }
.row > div { position: absolute; top: 0; height: 100%; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
.r-v { left: 0; width: 58px; justify-content: center; font-weight: 700; font-size: 19px; }
.r-km { left: 60px; width: 109px; justify-content: flex-end; padding-right: 9px; font-size: 17px; }
.r-name { left: 173px; width: 537px; padding-left: 12px; font-size: 19px; gap: 10px; }
.r-an { left: 714px; width: 120px; justify-content: center; font-size: 19px; }
.r-ab { left: 838px; width: 112px; justify-content: center; font-size: 19px; }
.row.halt .r-name .nm { font-weight: 700; font-size: 21px; }
.row.halt .r-an, .row.halt .r-ab { font-weight: 700; }
.row.halt { background: var(--halt-bg); }
.row.pass .r-ab { font-style: italic; }
.row.past { color: var(--scr-past); }
.row.nexthalt .nm { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.row.sel { outline: 2px dashed var(--accent); outline-offset: -2px; }
.sig { font-size: 13px; color: var(--scr-dim); border: 1px solid var(--scr-dim); border-radius: 3px; padding: 1px 4px; }
.nmr { margin-left: auto; padding-right: 10px; font-size: 15px; color: var(--scr-dim); }
.wende { font-weight: 700; color: var(--accent); }
.sprung { font-size: 12px; color: var(--accent); margin-left: 3px; }
sup.s { font-size: 11px; margin-left: 1px; vertical-align: 6px; color: var(--scr-dim); }
.vline { position: absolute; left: 50%; width: 3px; margin-left: -1.5px; background: var(--scr-fg); opacity: .8; }
.row.past .vline { opacity: .35; }
.vnum { position: relative; z-index: 2; background: var(--scr-bg); padding: 0 2px; }
.saege { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(135deg, var(--scr-fg) 0 2px, transparent 2px 6px); opacity: .5; }
#rows { position: absolute; inset: 0; z-index: 2; }
#marker { position: absolute; left: 0; width: 100%; height: 0; border-top: 3px solid var(--marker); z-index: 1; box-shadow: 0 0 10px var(--marker); pointer-events: none; }
#marker::before { content: ""; position: absolute; left: 0; top: -10px; border: 9px solid transparent; border-left: 14px solid var(--marker); }
#marker::after { content: ""; position: absolute; right: 0; top: -10px; border: 9px solid transparent; border-right: 14px solid var(--marker); }
#marker.manual { border-top-style: dashed; }
#scrollhint { position: absolute; right: 8px; top: 6px; z-index: 6; font-size: 13px; padding: 3px 8px; border-radius: 3px; background: var(--accent); color: #000; display: none; }
#empty { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: var(--scr-dim); font-size: 20px; line-height: 1.6; display: none; }

/* Meldezeile */
#msg { position: absolute; left: 0; top: 528px; width: 100%; height: 38px; border-top: 2px solid var(--scr-line); }
#msgbox { position: absolute; left: 0; top: 0; width: 650px; height: 100%; background: var(--blue); color: #fff; font-size: 17px; display: flex; align-items: center; padding: 0 12px; white-space: nowrap; overflow: hidden; }
#msgbox.warn { background: #b30000; }
#msgbox.ok { background: #00691f; }
#icons { position: absolute; left: 660px; right: 6px; top: 0; height: 100%; display: flex; align-items: center; gap: 14px; font-size: 13px; font-weight: 700; color: var(--scr-fg); }
.ico { position: relative; padding: 2px 4px; border: 1px solid currentColor; border-radius: 3px; }
.ico.off { color: var(--scr-dim); }
.ico.off::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 0; border-top: 3px solid #ff2a1a; transform: rotate(-28deg); }
.ico.off::before { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 0; border-top: 3px solid #ff2a1a; transform: rotate(28deg); }
#i-v { margin-left: auto; font-size: 17px; font-variant-numeric: tabular-nums; }

/* Softkeyleiste */
#soft { position: absolute; left: 0; top: 566px; width: 100%; height: 58px; background: var(--soft-bg); }
.sk { position: absolute; top: 7px; width: 70px; height: 42px; margin-left: -35px; background: var(--soft-btn); border: 1px solid #6c7783; color: var(--soft-txt); font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 1px 1px 0 #e7ecf0, inset -1px -1px 0 #7d8893; text-align: center; line-height: 1.05; }
.sk:empty { visibility: hidden; }
.sk:active { box-shadow: inset -1px -1px 0 #e7ecf0, inset 1px 1px 0 #7d8893; }

/* Überlagerte Seiten */
.page { position: absolute; left: 0; top: 70px; width: 100%; height: 458px; background: var(--scr-bg); z-index: 10; display: none; overflow: hidden; }
.page.show { display: block; }
.page h2 { margin: 0; height: 40px; line-height: 40px; padding: 0 14px; font-size: 19px; border-bottom: 2px solid var(--scr-line); }
.page h2 small { color: var(--scr-dim); font-weight: 400; font-size: 14px; margin-left: 10px; }
.kv { display: grid; grid-template-columns: 230px 1fr; gap: 0; padding: 6px 14px; font-size: 18px; }
.kv div { padding: 6px 0; border-bottom: 1px solid rgba(128,128,128,.25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv div:nth-child(odd) { color: var(--scr-dim); }
.list { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; overflow: hidden; }
.li { display: flex; align-items: center; height: 38px; padding: 0 14px; font-size: 18px; border-bottom: 1px solid rgba(128,128,128,.25); white-space: nowrap; cursor: pointer; font-variant-numeric: tabular-nums; }
.li.sel { background: var(--accent); color: #000; }
.li .c1 { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.li .c2, .li .c3, .li .c4 { width: 92px; text-align: center; }
.li .c5 { width: 64px; text-align: right; font-weight: 700; }
.li.head { color: var(--scr-dim); font-size: 14px; height: 28px; cursor: default; }
.li.done { color: var(--scr-past); }
.li .val { margin-left: auto; font-weight: 700; }
.li .arr { color: var(--scr-dim); margin: 0 8px; }
#graf canvas { position: absolute; left: 0; top: 40px; }
.help { columns: 2; column-gap: 24px; padding: 8px 14px; font-size: 14.5px; line-height: 1.42; }
.help b { display: inline-block; min-width: 54px; color: var(--accent); }
.help p { margin: 0 0 3px; break-inside: avoid; }
#fileinp { display: none; }
#toast { position: absolute; left: 50%; top: 210px; transform: translateX(-50%); z-index: 30; background: var(--accent); color: #000; font-size: 20px; font-weight: 700; padding: 10px 18px; border-radius: 4px; display: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="device">
  <svg id="outline" viewBox="0 0 1180 820" width="1180" height="820">
    <path d="M40 10 H1140 Q1170 10 1170 40 V780 Q1170 810 1140 810 H40 Q10 810 10 780 V600 L58 556 V244 L10 200 V40 Q10 10 40 10 Z" fill="none" stroke="var(--pink)" stroke-width="2.5"/>
  </svg>
  <div id="sensor"></div>
  <div class="led" id="led-kbd" style="left:54px;top:40px"></div>
  <div class="ledlbl" style="left:44px;top:57px">KBD</div>
  <div class="led" id="led-temp" style="left:102px;top:40px"></div>
  <div class="ledlbl" style="left:88px;top:57px">TEMP</div>
  <div id="keys"></div>

  <div id="screen">
    <div id="screen-inner">
      <div id="hdr">
        <div class="hc a" id="h-zug" style="left:0;width:171px"></div>
        <div class="hc a vsep" id="h-lauf" style="left:171px;width:541px"></div>
        <div class="hc a vsep" id="h-uhr" style="left:712px;width:124px"></div>
        <div class="hc a vsep" id="h-vsp" style="left:836px;width:114px"></div>
        <div class="hc b" style="left:0;width:171px">km<b id="h-km">–</b></div>
        <div class="hc b vsep" style="left:171px;width:541px" id="h-info"></div>
        <div class="hc b vsep" style="left:712px;width:124px;justify-content:center" id="h-datum"></div>
        <div class="hc b vsep" style="left:836px;width:114px;justify-content:center" id="h-mode"></div>
      </div>
      <div id="tbl">
        <div id="rows"></div>
        <div class="col-line" style="left:58px"></div>
        <div class="col-line" style="left:171px"></div>
        <div class="col-line" style="left:712px"></div>
        <div class="col-line" style="left:836px"></div>
        <div id="marker"></div>
        <div id="scrollhint">Vorschau – St: zurück zur Position</div>
        <div id="empty"></div>
      </div>

      <div class="page" id="p-zug"><h2>Zugdaten</h2><div class="kv" id="zugkv"></div></div>
      <div class="page" id="p-halte"><h2>Halte <small>▲▼ auswählen · E im Fahrplan anzeigen · C zurück</small></h2><div class="list" id="haltlist"></div></div>
      <div class="page" id="p-graf"><h2>Geschwindigkeitsprofil <small>◄► zoomen · ▲▼ verschieben · St Position</small></h2><canvas id="cv" width="944" height="414"></canvas></div>
      <div class="page" id="p-menu"><h2>Einstellungen <small>▲▼ wählen · ◄► ändern · E ausführen · C zurück</small></h2><div class="list" id="menulist"></div></div>
      <div class="page" id="p-info"><h2>Info &amp; Tastenbelegung <small id="verinfo"></small></h2><div class="help" id="helptext"></div></div>

      <div id="msg">
        <div id="msgbox"></div>
        <div id="icons">
          <span class="ico off" id="i-gps">GPS</span>
          <span class="ico off" id="i-zusi">ZUSI</span>
          <span id="i-v"></span>
        </div>
      </div>
      <div id="soft"></div>
      <div id="toast"></div>
    </div>
    <div id="dim"></div>
    <div id="blank"></div>
  </div>
  <input type="file" id="fileinp" accept=".xml,.trn,text/xml,application/xml">
</div>

<script>
'use strict';
/* =====================================================================
 *  Nussy EBuLa – elektronischer Buchfahrplan für Zusi 3
 *  Datenquellen: Zusi 3 (über bridge.js), Demo-Fahrt, Fahrplandatei
 * ===================================================================== */

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ------------------------------------------------------------ Einstellungen
const DEF = { source: 'auto', dir: 'up', rot: 0, day: false, bright: 100, secs: true, demoSpeed: 1, filter: 'alle', sound: true, rowH: 38, bridgeUrl: '' };
const S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem('ebula-settings') || '{}')); } catch (e) { /* privat */ }
function saveS() { try { localStorage.setItem('ebula-settings', JSON.stringify(S)); } catch (e) { /* egal */ } }

// ------------------------------------------------------------ Zustand
const st = {
  source: 'demo',            // zusi | demo | offline
  fpl: null,                 // { meta, rows, hasKm, hasTimes, origin }
  view: [],                  // Indizes der angezeigten Zeilen (Filter)
  live: { v: null, km: null, time: null, date: null, weg: null, vStrecke: null, afb: null, at: 0 },
  bridge: { ok: false, zusi: false, version: '', error: '', zugnummer: '', zugdatei: '', ladepause: null, xmlRev: -1 },
  pos: { p: 0, mode: 'keine', init: false, gps: false },
  scroll: 0,                 // manuelle Vorschau (Zeilen)
  manual: false,
  actual: {},                // Ist-Zeiten je Zeile { an, ab }
  delayMin: null,
  screen: 'main',
  sel: { halte: 0, menu: 0 },
  graf: { zoom: 1, off: 0 },
  trace: [],                 // [laufweg/Index, v km/h]
  off: false,
  msg: null,                 // { text, cls, until }
};

// ------------------------------------------------------------ Zeit-Helfer (Tage seit 30.12.1899 wie Zusi)
const EPOCH = Date.UTC(1899, 11, 30);
function dayNum(y, m, d) { return (Date.UTC(y, m - 1, d) - EPOCH) / 86400000; }
function parseTime(s) {
  if (!s) return null;
  let m = String(s).match(/(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?/);
  if (m) return dayNum(+m[1], +m[2], +m[3]) + ((+m[4]) * 3600 + (+m[5]) * 60 + (+(m[6] || 0))) / 86400;
  m = String(s).match(/^(\d\d?):(\d\d)(?::(\d\d))?$/);
  if (m) return ((+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0))) / 86400;
  return null;
}
function secsOfDay(t) { return ((Math.round(t * 86400) % 86400) + 86400) % 86400; }
const p2 = (n) => String(n).padStart(2, '0');
function fmtHM(t, withSec) {
  if (t == null) return '';
  const s = secsOfDay(t);
  const hm = p2(Math.floor(s / 3600)) + ':' + p2(Math.floor(s / 60) % 60);
  return withSec ? hm + ':' + p2(s % 60) : hm;
}
function fmtTimeCell(t) {
  if (t == null) return '';
  const s = secsOfDay(t), sec = s % 60;
  return fmtHM(t) + (S.secs && sec ? '<sup class="s">' + Math.floor(sec / 6) + '</sup>' : '');
}
function fmtDate(t) {
  if (t == null || t < 1000) return '';
  const d = new Date(EPOCH + Math.floor(t + 1e-9) * 86400000);
  return p2(d.getUTCDate()) + '.' + p2(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear();
}
function fmtDur(days) {
  const s = Math.max(0, Math.round(days * 86400));
  return Math.floor(s / 60) + ':' + p2(s % 60);
}
const fmtKm = (k, dec = 1) => k == null || isNaN(k) ? '' : k.toFixed(dec).replace('.', ',');

// ------------------------------------------------------------ Fahrplan einlesen
const num = (v) => { if (v == null || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const SIGTYP = { 7: 'Esig', 10: 'Sbk' };

function parseFahrplan(text, origin) {
  const doc = new DOMParser().parseFromString(String(text).replace(/^﻿/, '').trim(), 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Datei ist kein gültiges XML');
  const bf = doc.getElementsByTagName('Buchfahrplan')[0];
  let f;
  if (bf) f = parseTimetable(bf);
  else if (doc.getElementsByTagName('Zug')[0]) f = parseTrn(doc.getElementsByTagName('Zug')[0]);
  else throw new Error('Kein Buchfahrplan in der Datei gefunden');
  f.origin = origin;
  finishFahrplan(f);
  return f;
}

function parseTimetable(bf) {
  const a = (n) => bf.getAttribute(n);
  const meta = {
    gattung: a('Gattung') || '', nummer: a('Nummer') || '', zuglauf: a('Zuglauf') || '', br: a('BR') || '',
    masse: num(a('Masse')), vmax: num(a('spMax')), bremsh: num(a('Bremsh')), mbrh: num(a('MBrh')),
    laenge: num(a('Laenge')), kmStart: num(a('kmStart')), bremsstellung: a('BremsstellungZug') || a('Bremsstellung') || '',
  };
  const rows = [];
  for (const z of bf.getElementsByTagName('FplZeile')) {
    const r = { laufweg: num(z.getAttribute('FplLaufweg')), gleis: z.getAttribute('FplRglGgl'), name: '', nameR: '', km: null, kmNeu: null, sprung: false, vmax: null, ank: null, abf: null, sig: null, icon: null, wende: false, saege: 0 };
    for (const c of z.children) {
      const g = (n) => c.getAttribute(n);
      switch (c.tagName) {
        case 'Fplkm': if (r.km == null) r.km = num(g('km')); if (g('FplSprung') === '1' || g('FplkmNeu') != null) { r.sprung = true; r.kmNeu = num(g('FplkmNeu')); } break;
        case 'FplvMax': r.vmax = num(g('vMax')); break;
        case 'FplName': r.name = g('FplNameText') || ''; break;
        case 'FplNameRechts': r.nameR = g('FplNameText') || ''; break;
        case 'FplAnk': if (r.ank == null) r.ank = parseTime(g('Ank')); break;
        case 'FplAbf': if (r.abf == null) r.abf = parseTime(g('Abf')); break;
        case 'FplSignaltyp': r.sig = num(g('FplSignaltypNr')); break;
        case 'FplIcon': r.icon = num(g('FplIconNr')); break;
        case 'FplRichtungswechsel': r.wende = true; break;
        case 'FplSaegelinien': r.saege = num(g('FplAnzahl')) || 1; break;
      }
    }
    rows.push(r);
  }
  return { meta, rows };
}

function parseTrn(zug) {
  const a = (n) => zug.getAttribute(n);
  const meta = { gattung: a('Gattung') || '', nummer: a('Nummer') || '', zuglauf: a('Zuglauf') || '', br: '', masse: null, vmax: num(a('spAnfang')) , bremsh: null, mbrh: num(a('MBrh')), laenge: null, kmStart: null, bremsstellung: a('BremsstellungZug') || '' };
  meta.vmax = null;
  const rows = [];
  for (const e of zug.getElementsByTagName('FahrplanEintrag')) {
    const name = e.getAttribute('Betrst') || '';
    if (!name) continue;
    const ank = parseTime(e.getAttribute('Ank')), abf = parseTime(e.getAttribute('Abf'));
    rows.push({ laufweg: null, name, nameR: '', km: null, kmNeu: null, sprung: false, vmax: null, ank, abf, sig: null, icon: null, wende: /wende|richtung/i.test(e.getAttribute('FzgVerbandAktion') || ''), saege: 0 });
  }
  return { meta, rows };
}

function finishFahrplan(f) {
  const rows = f.rows;
  let v = null;
  rows.forEach((r, i) => {
    r.i = i;
    if (r.vmax != null && r.vmax > 0) { const kmh = Math.round(r.vmax * 3.6); r.vChange = kmh !== v; v = kmh; }
    r.vEff = v;
    r.halt = r.ank != null || (i === 0 && r.abf != null); // Startbahnhof
    r.pass = !r.halt && r.abf != null;
    r.t = r.abf ?? r.ank;
    r.kmA = r.sprung && r.kmNeu != null ? r.kmNeu : r.km;
  });
  // fehlende km-Werte zwischen bekannten Zeilen interpolieren
  const known = rows.filter((r) => r.km != null);
  f.hasKm = known.length >= 2;
  if (f.hasKm) {
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].km != null) continue;
      let a = i - 1; while (a >= 0 && rows[a].km == null) a--;
      let b = i + 1; while (b < rows.length && rows[b].km == null) b++;
      if (a >= 0 && b < rows.length) {
        const k1 = rows[a].kmA, k2 = rows[b].km;
        const w = rows[i].laufweg != null && rows[a].laufweg != null && rows[b].laufweg != null && rows[b].laufweg !== rows[a].laufweg
          ? (rows[i].laufweg - rows[a].laufweg) / (rows[b].laufweg - rows[a].laufweg) : (i - a) / (b - a);
        rows[i].km = rows[i].kmA = k1 + (k2 - k1) * w; rows[i].kmInterp = true;
      } else if (a >= 0) { rows[i].km = rows[i].kmA = rows[a].kmA; rows[i].kmInterp = true; }
      else if (b < rows.length) { rows[i].km = rows[i].kmA = rows[b].km; rows[i].kmInterp = true; }
    }
  }
  f.hasTimes = rows.some((r) => r.t != null);
  f.hasWeg = rows.length > 1 && rows.every((r) => r.laufweg != null);
  // Tagesbezug, falls Zeiten ohne Datum
  const t0 = rows.find((r) => r.t != null);
  f.baseDay = t0 ? Math.floor(t0.t) : null;
  f.timed = rows.filter((r) => r.t != null).map((r) => r.i);
}

function zugTitel(f) {
  const m = f?.meta || {};
  const t = ((m.gattung || '') + ' ' + (m.nummer || '')).trim();
  return t || st.bridge.zugnummer || '';
}

// ------------------------------------------------------------ Fahrplan laden / Sichtbarkeit
function loadFahrplan(f, quiet) {
  st.fpl = f;
  st.actual = {};
  st.trace = [];
  st.delayMin = null;
  st.atHalt = null;
  st.pos = { p: 0, mode: 'keine', init: false, gps: false };
  st.scroll = 0; st.manual = false; st.sel.halte = 0; st.graf = { zoom: 1, off: 0 };
  buildView();
  if (!quiet) flash(`Fahrplan geladen: ${zugTitel(f) || 'unbenannt'} (${f.rows.length} Zeilen, ${f.origin})`, 'ok');
  render();
}

function rowVisible(r) {
  if (S.filter === 'alle') return true;
  return r.halt || r.pass || r.vChange || r.wende || r.sprung || r.i === 0 || r.i === st.fpl.rows.length - 1 || (r.name && !r.sig);
}
function buildView() {
  st.view = st.fpl ? st.fpl.rows.filter(rowVisible).map((r) => r.i) : [];
}
// Fahrplan-Position (Zeilenindex) -> Anzeigeposition (Index in st.view)
function toViewPos(p) {
  const v = st.view; if (!v.length) return 0;
  const i = Math.floor(p), f = p - i;
  let lo = 0, hi = v.length - 1;
  if (p <= v[0]) return 0;
  if (p >= v[hi]) return hi;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (v[m] <= p) lo = m; else hi = m; }
  const a = v[lo], b = v[hi];
  return lo + (p - a) / (b - a || 1);
}

// ------------------------------------------------------------ Position bestimmen
function simTime() {
  const L = st.live;
  if (L.time == null) return null;
  const base = st.fpl?.baseDay;
  if (L.date != null && L.date > 1000) {
    const t = Math.floor(L.date + 1e-6) + L.time;
    // Datum passt nicht zum Fahrplan (z. B. anderes Fahrplanjahr): nur Uhrzeit verwenden
    if (base == null || Math.abs(t - base) < 2) return t;
  }
  if (base == null) return L.time;
  // Datum fehlt: Tag wählen, der dem Fahrplan am nächsten liegt
  const t0 = st.fpl.rows[st.fpl.timed[0]].t;
  let best = base + L.time;
  for (const d of [base - 1, base + 1]) if (Math.abs(d + L.time - t0) < Math.abs(best - t0)) best = d + L.time;
  return best;
}

function locateKm(km) {
  const rows = st.fpl.rows, n = rows.length;
  const seg = (j) => {
    const k1 = rows[j].kmA, k2 = rows[j + 1].km;
    if (k1 == null || k2 == null) return null;
    const tol = 0.03;
    if (km < Math.min(k1, k2) - tol || km > Math.max(k1, k2) + tol) return null;
    return j + (k2 === k1 ? 0 : clamp((km - k1) / (k2 - k1), 0, 1));
  };
  if (st.pos.init) {
    const c = Math.floor(st.pos.p);
    for (let j = Math.max(0, c - 1); j <= Math.min(n - 2, c + 60); j++) { const r = seg(j); if (r != null && r >= st.pos.p - 0.6) return r; }
    for (let j = Math.max(0, c - 4); j < c - 1; j++) { const r = seg(j); if (r != null) return r; }
  }
  // Globale Suche – mehrere Treffer: am nächsten zur fahrplanmäßigen Position
  const cand = [];
  for (let j = 0; j < n - 1; j++) { const r = seg(j); if (r != null) cand.push(r); }
  if (!cand.length) return null;
  const ref = st.pos.init ? st.pos.p : (timePos() ?? 0);
  cand.sort((a, b) => Math.abs(a - ref) - Math.abs(b - ref));
  return cand[0];
}

function timePos() {
  const f = st.fpl, t = simTime();
  if (!f || !f.hasTimes || t == null) return null;
  const T = f.timed, R = f.rows;
  if (t <= R[T[0]].t) return T[0];
  for (let k = 0; k < T.length - 1; k++) {
    const a = R[T[k]], b = R[T[k + 1]];
    const ta = a.abf ?? a.t, tb = b.ank ?? b.t;
    if (t >= a.t && t < (a.abf ?? a.t)) return a.i; // Haltezeit
    if (t >= ta && t < tb) return a.i + (b.i - a.i) * (t - ta) / ((tb - ta) || 1e-9);
  }
  return T[T.length - 1];
}

function updatePosition() {
  const f = st.fpl;
  if (!f || !f.rows.length) return;
  const L = st.live;
  const old = st.pos.p;
  let p = null, mode = st.pos.mode;
  if (st.manual) { mode = 'manuell'; p = old; }
  else if (L.km != null && f.hasKm && st.source !== 'offline') {
    p = locateKm(L.km);
    if (p != null) { mode = 'km'; st.pos.gps = true; }
    else { st.pos.gps = false; p = timePos(); mode = p != null ? 'Zeit' : 'keine'; }
  } else {
    st.pos.gps = false;
    p = timePos();
    mode = p != null ? 'Zeit' : (st.source === 'offline' ? 'manuell' : 'keine');
  }
  if (p == null) p = st.pos.init ? old : 0;
  st.pos.mode = mode;
  st.pos.p = p;
  // Ist-Zeiten aufzeichnen
  const t = simTime();
  if (t != null && st.pos.init && mode !== 'manuell') {
    const act = (i) => st.actual[i] || (st.actual[i] = {});
    const ch = curHalt();
    if (ch != null) { if (act(ch).an == null && ch > 0) act(ch).an = t; st.atHalt = ch; }
    else if (st.atHalt != null) { act(st.atHalt).ab = t; st.atHalt = null; } // Abfahrt
    if (Math.abs(p - old) <= 6) {
      for (let i = Math.floor(old) + (old % 1 > 0.01 ? 1 : 0); i <= Math.floor(p - 0.01); i++) {
        const r = f.rows[i];
        if (!r || r.t == null || st.atHalt === i) continue;
        if (act(i).ab == null && i < p - 0.01) act(i).ab = t;
      }
    }
  }
  st.pos.init = true;
  computeDelay();
  if (L.v != null) {
    const x = xOf(p);
    const last = st.trace[st.trace.length - 1];
    if (!last || Math.abs(last[0] - x) > (f.hasWeg ? 20 : 0.02)) st.trace.push([x, L.v * 3.6]);
    if (st.trace.length > 20000) st.trace.splice(0, 5000);
  }
}

function computeDelay() {
  const f = st.fpl, t = simTime();
  if (!f || t == null || st.pos.mode === 'manuell') { st.delayMin = null; return; }
  let d = null;
  // letzte erfasste Ist-Zeit
  for (let i = Math.min(f.rows.length - 1, Math.floor(st.pos.p) + 1); i >= 0; i--) {
    const a = st.actual[i], r = f.rows[i];
    if (!a || !r || r.t == null) continue;
    if (a.ab != null) { d = a.ab - (r.abf ?? r.t); break; }
    if (a.an != null && r.ank != null) { d = a.an - r.ank; break; }
  }
  const ch = curHalt();
  // nächste Zeile mit Zeit noch nicht erreicht, Planzeit aber schon vorbei
  const nx = nextTimed(st.pos.p);
  if (nx != null && nx !== ch) {
    const r = f.rows[nx];
    const plan = r.halt ? r.ank : r.t;
    if (plan != null && t > plan) d = Math.max(d ?? -1e9, t - plan);
  }
  // am Halt: Abfahrtszeit überschritten
  if (ch != null) {
    const r = f.rows[ch];
    if (r.abf != null && t > r.abf) d = Math.max(d ?? -1e9, t - r.abf);
  }
  st.delayMin = d == null ? null : Math.trunc(d * 1440 + (d > 0 ? 1e-9 : -1e-9));
}

function nextTimed(p) {
  const f = st.fpl; if (!f) return null;
  for (const i of f.timed) if (i > p + 0.02) return i;
  return null;
}
function nextHalt(p) {
  const f = st.fpl; if (!f) return null;
  for (const i of f.timed) if (i > p + 0.02 && f.rows[i].halt) return i;
  return null;
}
function curHalt() {
  const f = st.fpl;
  if (!f || !st.pos.init) return null;
  if ((st.live.v ?? 0) >= 0.5 && st.source !== 'offline') return null;
  const p = st.pos.p;
  let best = null, bd = 1e9;
  for (const i of [Math.floor(p), Math.floor(p) + 1]) {
    const r = f.rows[i];
    if (!r || !r.halt) continue;
    let d;
    if (st.pos.mode === 'manuell' || st.pos.mode === 'Zeit') d = Math.abs(p - i) < 0.05 ? 0 : 1e9;
    else if (f.hasWeg) d = Math.abs(wegAt(p) - r.laufweg) / 1000;
    else if (f.hasKm) d = Math.abs((kmAtP(p) ?? r.km) - r.km);
    else d = Math.abs(p - i) < 0.05 ? 0 : 1e9;
    if (d < bd) { bd = d; best = i; }
  }
  return bd <= 0.3 ? best : null;
}
function wegAt(p) {
  const R = st.fpl.rows, i = Math.floor(p), f = p - i;
  const a = R[clamp(i, 0, R.length - 1)], b = R[clamp(i + 1, 0, R.length - 1)];
  if (a.laufweg == null || b.laufweg == null) return null;
  return a.laufweg + (b.laufweg - a.laufweg) * f;
}
function xOf(p) { return st.fpl.hasWeg ? wegAt(p) : p; }

// ------------------------------------------------------------ Darstellung
let renderQueued = false;
function render() { if (!renderQueued) { renderQueued = true; requestAnimationFrame(doRender); } }

function doRender() {
  renderQueued = false;
  document.body.classList.toggle('day', !!S.day);
  $('device').classList.toggle('day', !!S.day);
  $('dim').style.opacity = String((100 - S.bright) / 100 * 0.85);
  $('blank').style.display = st.off ? 'block' : 'none';
  renderHeader();
  renderTable();
  renderMsg();
  renderSoft();
  renderPages();
  renderLeds();
}

function renderHeader() {
  const f = st.fpl, t = simTime();
  $('h-zug').textContent = zugTitel(f) || '—';
  const nh = f ? nextHalt(st.pos.p) : null;
  const ch = curHalt();
  let lauf = '';
  if (!f) lauf = '<small>Zuglauf</small>–';
  else if (ch != null) lauf = `<small>Halt</small><b>${esc(f.rows[ch].name)}</b>`;
  else if (nh != null) lauf = `<small>nächster Halt</small><b>${esc(f.rows[nh].name)}</b>&nbsp;${fmtHM(f.rows[nh].ank)}`;
  else lauf = `<small>Zuglauf</small>${esc(f.meta.zuglauf || '–')}`;
  $('h-lauf').innerHTML = lauf;
  $('h-uhr').textContent = t != null ? fmtHM(t, true) : '--:--:--';
  const vs = $('h-vsp');
  vs.classList.remove('late', 'early');
  if (st.delayMin == null) vs.textContent = '';
  else if (st.delayMin > 0) { vs.textContent = '+' + st.delayMin; vs.classList.add('late'); }
  else if (st.delayMin < 0) { vs.textContent = String(st.delayMin); vs.classList.add('early'); }
  else vs.textContent = '±0';
  $('h-km').textContent = st.live.km != null && st.source !== 'offline' ? fmtKm(st.live.km, 2) : (f && f.hasKm && st.pos.init ? fmtKm(kmAtP(st.pos.p), 1) : '–');
  $('h-datum').textContent = t != null && t > 1000 ? fmtDate(t) : '';
  $('h-mode').textContent = { km: 'Ortung km', Zeit: 'Ortung Zeit', manuell: 'Manuell', keine: 'keine Ortung' }[st.pos.mode] || '';
  let info = '';
  if (f) {
    const m = f.meta;
    const parts = [];
    if (m.zuglauf) parts.push(esc(m.zuglauf));
    if (m.br) parts.push('BR ' + esc(m.br));
    if (m.vmax) parts.push('Vmax ' + Math.round(m.vmax * 3.6));
    if (st.live.vStrecke != null && st.source !== 'offline') parts.push('Strecke ' + Math.round(st.live.vStrecke * 3.6) + ' km/h');
    info = parts.join(' · ');
  } else info = st.source === 'zusi' ? 'Warte auf Fahrplan von Zusi …' : 'Kein Fahrplan geladen';
  $('h-info').innerHTML = info;
}
function kmAtP(p) {
  const R = st.fpl.rows, i = clamp(Math.floor(p), 0, R.length - 1), j = clamp(i + 1, 0, R.length - 1);
  const a = R[i].kmA, b = R[j].km; if (a == null || b == null) return null;
  return a + (b - a) * (p - i);
}

function renderTable() {
  const box = $('rows'), f = st.fpl;
  const H = S.rowH, TH = 458;
  const up = S.dir === 'up';
  if (!f || !st.view.length) {
    box.innerHTML = '';
    $('marker').style.display = 'none';
    const e = $('empty');
    e.style.display = 'block';
    e.innerHTML = st.source === 'zusi'
      ? (st.bridge.ok ? (st.bridge.zusi ? 'Verbunden mit Zusi – warte auf Buchfahrplan …<br><small>Zug in Zusi starten oder Fahrplandatei laden (Taste 3)</small>' : 'Bridge läuft – Zusi 3 nicht verbunden<br><small>Zusi starten, TCP-Server aktiv? Port 1436</small>') : 'Keine Verbindung zur Bridge<br><small>bridge.js auf dem Zusi-PC starten · Einstellungen: Taste S</small>')
      : 'Kein Fahrplan geladen<br><small>Taste 3: Fahrplandatei (*.timetable.xml) laden · Taste S: Demo</small>';
    $('scrollhint').style.display = 'none';
    return;
  }
  $('empty').style.display = 'none';
  const vp = toViewPos(st.pos.p);
  const base = up ? TH * 0.74 : TH * 0.24;
  const center = vp + st.scroll; // Zeile auf Höhe der Basislinie
  const yOf = (k) => up ? base - (k - center) * H : base + (k - center) * H;
  const first = Math.max(0, Math.floor(center - (up ? (TH - base) : base) / H) - 2);
  const last = Math.min(st.view.length - 1, Math.ceil(center + (up ? base : TH - base) / H) + 2);
  const nh = nextHalt(st.pos.p);
  let html = '';
  for (let k = first; k <= last; k++) {
    const r = f.rows[st.view[k]];
    const y = yOf(k) - H / 2;
    const cls = ['row'];
    if (r.halt) cls.push('halt');
    if (r.pass) cls.push('pass');
    if (r.i < st.pos.p - 0.02 && st.pos.init) cls.push('past');
    if (r.i === nh) cls.push('nexthalt');
    if (st.screen === 'main' && st.scroll !== 0 && k === Math.round(center)) cls.push('sel');
    // Geschwindigkeitslinie bis zur nächsten angezeigten Zeile
    let vcell = '';
    if (r.vEff != null) vcell += '<span class="vline" style="top:0;height:100%"></span>';
    if (r.vChange) vcell += `<span class="vnum">${r.vEff}</span>`;
    let km = r.km != null && !r.kmInterp ? fmtKm(r.km) : '';
    if (r.sprung && r.kmNeu != null) km += `<span class="sprung">→${fmtKm(r.kmNeu)}</span>`;
    let name = '';
    if (r.wende) name += '<span class="wende">⇅ Richtungswechsel</span>';
    const sigTxt = r.sig != null && SIGTYP[r.sig] && !(r.name || '').toLowerCase().includes(SIGTYP[r.sig].toLowerCase()) ? SIGTYP[r.sig] : '';
    if (r.name) name += `<span class="nm">${esc(r.name)}</span>`;
    if (sigTxt) name += `<span class="sig">${sigTxt}</span>`;
    if (r.gleis === '2' || r.gleis === 'Gegengleis') name += '<span class="sig">Ggl</span>';
    if (r.nameR) name += `<span class="nmr">${esc(r.nameR)}</span>`;
    const act = st.actual[r.i];
    let an = r.ank != null ? fmtTimeCell(r.ank) : '';
    let ab = r.abf != null ? fmtTimeCell(r.abf) : '';
    if (r.halt && r.abf == null && r.i === f.rows.length - 1) ab = '';
    html += `<div class="${cls.join(' ')}" style="top:${y.toFixed(1)}px;height:${H}px">` +
      `<div class="r-v">${vcell}</div><div class="r-km">${km}</div>` +
      `<div class="r-name">${name}${r.saege ? '<span class="saege"></span>' : ''}</div>` +
      `<div class="r-an">${an}</div><div class="r-ab">${ab}</div></div>`;
  }
  box.innerHTML = html;
  const mk = $('marker');
  const my = yOf(vp);
  mk.style.display = my > -5 && my < TH + 5 ? 'block' : 'none';
  mk.style.top = my.toFixed(1) + 'px';
  mk.classList.toggle('manual', st.pos.mode !== 'km');
  $('scrollhint').style.display = st.scroll !== 0 ? 'block' : 'none';
}

function defaultMsg() {
  const f = st.fpl, t = simTime();
  if (st.source === 'zusi' && !st.bridge.ok) return ['Keine Verbindung zur Bridge (bridge.js)', 'warn'];
  if (st.source === 'zusi' && !st.bridge.zusi) return ['Bridge aktiv – keine Verbindung zu Zusi 3', 'warn'];
  if (st.source === 'zusi' && st.bridge.ladepause === 1) return ['Zusi lädt die Strecke …', ''];
  if (!f) return ['Kein Fahrplan geladen', ''];
  const ch = curHalt();
  if (ch != null) {
    const r = f.rows[ch];
    if (r.abf == null) return [`Ziel erreicht: ${r.name}`, 'ok'];
    if (t != null) {
      const rest = r.abf - t;
      return rest > 0 ? [`Halt ${r.name} – Abfahrt ${fmtHM(r.abf, true)} · noch ${fmtDur(rest)}`, ''] : [`Abfahrt ${r.name} ${fmtHM(r.abf)} – Abfahrzeit erreicht`, 'ok'];
    }
    return [`Halt ${r.name} – Abfahrt ${fmtHM(r.abf)}`, ''];
  }
  const nh = nextHalt(st.pos.p);
  if (nh != null) {
    const r = f.rows[nh];
    let dist = '';
    if (f.hasWeg && st.pos.init) { const d = (r.laufweg - wegAt(st.pos.p)) / 1000; if (d >= 0) dist = ` · ${fmtKm(d, d < 10 ? 2 : 1)} km`; }
    else if (f.hasKm && st.pos.init) { const d = Math.abs(r.km - (kmAtP(st.pos.p) ?? r.km)); dist = ` · ${fmtKm(d, 1)} km`; }
    let rest = '';
    if (t != null && r.ank != null) { const dt = r.ank - t; rest = dt >= 0 ? ` · in ${fmtDur(dt)}` : ''; }
    return [`Nächster Halt ${r.name} an ${fmtHM(r.ank)}${dist}${rest}`, ''];
  }
  return [f.meta.zuglauf ? f.meta.zuglauf : 'Fahrplanende', ''];
}

function renderMsg() {
  const box = $('msgbox');
  let text, cls;
  if (st.msg && st.msg.until > Date.now()) { text = st.msg.text; cls = st.msg.cls; }
  else [text, cls] = defaultMsg();
  box.textContent = text;
  box.className = cls || '';
  $('i-gps').classList.toggle('off', !(st.pos.gps && st.pos.mode === 'km'));
  const live = st.source === 'demo' || (st.source === 'zusi' && st.bridge.zusi);
  $('i-zusi').textContent = st.source === 'demo' ? 'DEMO' : 'ZUSI';
  $('i-zusi').classList.toggle('off', !live);
  $('i-v').textContent = st.live.v != null && st.source !== 'offline' ? Math.round(Math.abs(st.live.v) * 3.6) + ' km/h' : '';
}

const SOFT = {
  main: { 1: 'Zug', 2: 'Halte', 3: 'Datei', 4: 'Filter', 9: 'Info', 0: 'G' },

function renderGraf() {
  const cv = $('cv'), g = cv.getContext('2d'), f = st.fpl;
  const W = cv.width, H = cv.height, cs = getComputedStyle($('device'));
  const fg = cs.getPropertyValue('--scr-fg').trim(), dim = cs.getPropertyValue('--scr-dim').trim(), line = cs.getPropertyValue('--scr-line').trim();
  g.clearRect(0, 0, W, H);

  g.font = '12px sans-serif'; g.lineWidth = 1;
  for (let v = 0; v <= vmax; v += 20) {
    g.strokeStyle = 'rgba(128,128,128,.25)'; g.beginPath(); g.moveTo(L, sy(v)); g.lineTo(L + PW, sy(v)); g.stroke();
    g.fillStyle = dim; g.fillText(String(v), 8, sy(v) + 4);

  g.strokeStyle = fg; g.lineWidth = 2.5; g.beginPath();

    if (!started) { g.moveTo(sx(Math.max(a, from)), sy(r.vEff)); started = true; } else g.lineTo(sx(a), sy(r.vEff));

  g.fillText(f.hasWeg ? `Ausschnitt ${fmtKm((to - from) / 1000)} km` : 'Ausschnitt nach Zeilen', L + PW - 150, T + 12);

}

let audioCtx = null;
function click() {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 1900; g.gain.value = 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.03);
  } catch (e) { /* kein Ton */ }
}
let kbdT = null;
function press(k) {
  click();
  const led = $('led-kbd'); led.className = 'led on-y'; clearTimeout(kbdT); kbdT = setTimeout(() => { led.className = 'led'; }, 140);
  const btn = document.querySelector(`.key[data-k="${CSS.escape(k)}"]`);
  if (btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 120); }
  if (st.off && k !== 'aus') { st.off = false; render(); return; }
  handleKey(k);
  render();
}

function handleKey(k) {
  // global
  switch (k) {
    case 'aus': st.off = !st.off; return;
    case 'hell': S.bright = S.bright <= 30 ? 100 : S.bright - 20; saveS(); toast('Helligkeit ' + S.bright + ' %'); return;
    case 'kontrast': S.day = !S.day; saveS(); toast(S.day ? 'Tagmodus' : 'Nachtmodus'); return;
    case 'UD': S.rot = (S.rot + 90) % 360; saveS(); layout(); toast('Drehung ' + S.rot + '°'); return;
    case 'S': st.screen = st.screen === 'menu' ? 'main' : 'menu'; return;
    case 'i': case '9': if (k === 'i' || st.screen === 'main') { st.screen = st.screen === 'info' ? 'main' : 'info'; return; } break;
  }
  if (st.screen !== 'main' && (k === 'C' || k === '0')) { st.screen = 'main'; return; }
  if (st.screen === 'menu') return menuKey(k);
  if (st.screen === 'halte') return halteKey(k);
  if (st.screen === 'graf') return grafKey(k);
  if (st.screen === 'zug') { if (k === '3') $('fileinp').click(); if (k === 'E') st.screen = 'main'; return; }
  if (st.screen === 'info') { if (k === 'E') st.screen = 'main'; return; }
  // Hauptansicht
  const n = st.view.length;
  const page = Math.max(1, Math.floor(458 / S.rowH) - 2);
  switch (k) {
    case 'up': st.scroll = clamp(st.scroll + (S.dir === 'up' ? 1 : -1), -n, n); break;
    case 'down': st.scroll = clamp(st.scroll - (S.dir === 'up' ? 1 : -1), -n, n); break;
    case 'right': st.scroll = clamp(st.scroll + page, -n, n); break;
    case 'left': st.scroll = clamp(st.scroll - page, -n, n); break;
    case 'St': st.scroll = 0; if (st.manual) { st.manual = false; flash('Automatische Ortung aktiv', 'ok'); } updatePosition(); break;
    case 'V>0': manualStep(1); break;
    case 'V=0': manualStep(-1); break;
    case 'C': st.msg = null; st.scroll = 0; break;
    case 'E': if (st.scroll !== 0 && st.fpl) { const r = st.fpl.rows[st.view[clamp(Math.round(toViewPos(st.pos.p) + st.scroll), 0, n - 1)]]; if (r) flash(`${r.name || 'Zeile'} · km ${fmtKm(r.km, 3)}${r.vEff ? ' · ' + r.vEff + ' km/h' : ''}`, ''); } break;
    case '1': st.screen = 'zug'; break;
    case '2': st.screen = 'halte'; { const L = halteListe(); const nh = nextHalt(st.pos.p - 0.5); st.sel.halte = Math.max(0, L.findIndex((r) => r.i >= (nh ?? 0))); } break;
    case '3': $('fileinp').click(); break;
    case '4': toggleFilter(); break;
    case '0': st.screen = 'graf'; st.graf.off = 0; break;
  }
}

function toggleFilter() {

  toast(S.filter === 'alle' ? 'Alle Zeilen' : 'Nur Betriebsstellen');

function manualStep(d) {
  if (!st.fpl) return;
  if (!st.manual) { st.manual = true; flash('Manuelle Positionierung – St: zurück zur Automatik', ''); }
  const v = st.view;
  let k = Math.round(toViewPos(st.pos.p)) + d;
  k = clamp(k, 0, v.length - 1);
  st.pos.p = v[k]; st.pos.mode = 'manuell'; st.pos.init = true; st.scroll = 0;
}

function menuKey(k) {
  const m = MENU[st.sel.menu];
  if (k === 'up') st.sel.menu = (st.sel.menu - 1 + MENU.length) % MENU.length;
  else if (k === 'down') st.sel.menu = (st.sel.menu + 1) % MENU.length;
  else if ((k === 'left' || k === 'right') && m.ch) { m.ch(k === 'left' ? -1 : 1); saveS(); }
  else if (k === 'E') { if (m.a) m.a(); else if (m.ch) m.ch(1); saveS(); }
  else if (/^[1-9]$/.test(k)) { st.sel.menu = clamp(+k - 1, 0, MENU.length - 1); }
}
function halteKey(k) {
  const L = halteListe();
  if (k === 'up') st.sel.halte = Math.max(0, st.sel.halte - 1);
  else if (k === 'down') st.sel.halte = Math.min(L.length - 1, st.sel.halte + 1);
  else if (k === 'left') st.sel.halte = Math.max(0, st.sel.halte - 8);
  else if (k === 'right') st.sel.halte = Math.min(L.length - 1, st.sel.halte + 8);
  else if (k === 'E' && L[st.sel.halte]) {
    const r = L[st.sel.halte];
    st.screen = 'main';
    st.scroll = toViewPos(r.i) - toViewPos(st.pos.p);
    if (st.scroll === 0) st.scroll = 1e-6;
  }
}
function grafKey(k) {
  if (k === 'left') st.graf.zoom = Math.max(1, st.graf.zoom / 1.6);
  else if (k === 'right') st.graf.zoom = Math.min(40, st.graf.zoom * 1.6);
  else if (k === 'up') st.graf.off += 0.25;
  else if (k === 'down') st.graf.off -= 0.25;
  else if (k === 'St' || k === 'E') st.graf.off = 0;
  if (st.graf.zoom === 1) st.graf.off = 0;
}

function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else flash('iPad: Teilen ▸ „Zum Home-Bildschirm“ für Vollbild', '');
  } catch (e) { flash('Vollbild nicht verfügbar', 'warn'); }
}

  if (mi) { const i = +mi.dataset.mi; if (st.sel.menu === i) press('E'); else { st.sel.menu = i; render(); } return; }
  const hi = e.target.closest('[data-hi]');
  if (hi) { const i = +hi.dataset.hi; if (st.sel.halte === i) press('E'); else { st.sel.halte = i; render(); } return; }
  if (st.off && e.target.closest('#screen')) { st.off = false; render(); }
});
// Wischen im Fahrplan = blättern
let swipe = null;
$('tbl').addEventListener('touchstart', (e) => { swipe = { y: e.touches[0].clientY, s: st.scroll }; }, { passive: true });
$('tbl').addEventListener('touchmove', (e) => {
  if (!swipe) return;
  const dy = (e.touches[0].clientY - swipe.y) / scale;
  const rows = dy / S.rowH * (S.dir === 'up' ? 1 : -1);
  st.scroll = Math.round(swipe.s + rows);
  render();
}, { passive: true });
$('tbl').addEventListener('wheel', (e) => { e.preventDefault(); press(e.deltaY < 0 ? 'up' : 'down'); }, { passive: false });

const KBMAP = { Enter: 'E', Escape: 'C', Backspace: 'C', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', PageUp: 'V>0', PageDown: 'V=0', Home: 'St', s: 'S', i: 'i', t: 'St', h: 'hell', n: 'kontrast', u: 'UD', a: 'aus', f: 'fullscreen', '+': 'V>0', '-': 'V=0' };
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  let k = /^[0-9]$/.test(e.key) ? e.key : KBMAP[e.key] || KBMAP[e.key.toLowerCase()];
  if (!k) return;
  e.preventDefault();
  if (k === 'fullscreen') return toggleFullscreen();
  press(k);
});

// Datei laden
$('fileinp').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) text = new TextDecoder('windows-1252').decode(buf);
    const f = parseFahrplan(text, 'Datei ' + file.name);
    if (st.source === 'demo') setSource('offline', false, true);
    st.fileLoaded = true;
    loadFahrplan(f);
    st.screen = 'main';
  } catch (err) { flash('Fehler: ' + err.message, 'warn', 7000); }
});

// ------------------------------------------------------------ Skalierung / Drehung
let scale = 1;
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const rot = S.rot % 180 !== 0;
  const w = rot ? 820 : 1180, h = rot ? 1180 : 820;
  scale = Math.min(vw / w, vh / h);
  $('device').style.transform = `translate(-50%,-50%) rotate(${S.rot}deg) scale(${scale})`;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

// ------------------------------------------------------------ Datenquellen
function bridgeBase() { return S.bridgeUrl || (location.protocol.startsWith('http') ? '' : 'http://localhost:8080'); }
let es = null;
function stopBridge() { if (es) { es.close(); es = null; } st.bridge.ok = false; st.bridge.zusi = false; }
function startBridge() {
  stopBridge();
  try { es = new EventSource(bridgeBase() + '/events'); } catch (e) { flash('Bridge-Adresse ungültig', 'warn'); return; }
  es.onopen = () => { st.bridge.ok = true; render(); };
  es.onerror = () => { st.bridge.ok = false; st.bridge.zusi = false; render(); };
  es.addEventListener('status', (e) => {
    const s = JSON.parse(e.data);
    const was = st.bridge.zusi;
    st.bridge.ok = true;
    Object.assign(st.bridge, { zusi: s.zusi, version: s.version, error: s.error });
    if (s.zusi && !was) flash('Verbindung zu Zusi ' + (s.version || '') + ' hergestellt', 'ok');
    if (!s.zusi) { st.live = { v: null, km: null, time: null, date: null, weg: null, vStrecke: null, afb: null, at: 0 }; }
    render();
  });
  es.addEventListener('ftd', (e) => {
    const d = JSON.parse(e.data), L = st.live;
    if (d[1] != null) L.v = d[1];
    if (d[0x23] != null) L.time = d[0x23];
    if (d[0x4B] != null) L.date = d[0x4B];
    if (d[0x61] != null) L.km = d[0x61];
    if (d[0x19] != null) L.weg = d[0x19];
    if (d[0x4D] != null) L.vStrecke = d[0x4D];
    if (d[0x17] != null) L.afb = d[0x17];
    L.at = Date.now();
    updatePosition();
    render();
  });
  es.addEventListener('prog', (e) => {
    const p = JSON.parse(e.data), b = st.bridge;
    const newTrain = p.zugdatei && p.zugdatei !== b.zugdatei && b.zugdatei;
    Object.assign(b, { zugnummer: p.zugnummer, zugdatei: p.zugdatei, ladepause: p.ladepause });
    if (p.xml && p.xmlRev !== b.xmlRev) {
      b.xmlRev = p.xmlRev;
      try { loadFahrplan(parseFahrplan(p.xml, p.xmlSource === 'Zusi' ? 'Zusi (live)' : p.xmlSource)); st.fileLoaded = false; }
      catch (err) { flash('Buchfahrplan von Zusi fehlerhaft: ' + err.message, 'warn', 7000); }
    } else if (newTrain && !st.fileLoaded) { st.fpl = null; buildView(); }
    render();
  });
}

// Demo: simulierte Fahrt auf einer fiktiven Strecke

const demo = { timer: null, weg: 0, v: 0, t: 0, dwellUntil: null, lastTs: 0 };
function demoKm(weg) {
  const R = st.fpl.rows;
  for (let j = 0; j < R.length - 1; j++) {
    const a = R[j], b = R[j + 1];
    if (weg <= b.laufweg) return a.kmA + (b.km - a.kmA) * (weg - a.laufweg) / ((b.laufweg - a.laufweg) || 1);
  }
  return R[R.length - 1].km;
}
function startDemo() {
  stopDemo();
  loadFahrplan(parseFahrplan(DEMO_XML, 'Demo'), true);
  const R = st.fpl.rows;
  Object.assign(demo, { weg: 0, v: 0, t: R[0].abf - 50 / 86400, dwellUntil: R[0].abf, lastTs: performance.now() });
  st.live = { v: 0, km: R[0].km, time: demo.t % 1, date: Math.floor(demo.t), weg: 0, vStrecke: R[0].vmax, afb: null, at: Date.now() };
  updatePosition();
  demo.timer = setInterval(demoTick, 100);
  flash('Demo-Fahrt RE 4711 – Zeitraffer ×' + S.demoSpeed + ' (Einstellungen: S)', 'ok', 6000);
}
function stopDemo() { if (demo.timer) clearInterval(demo.timer); demo.timer = null; }
function demoTick() {
  const now = performance.now();
  let dt = Math.min(0.5, (now - demo.lastTs) / 1000) * S.demoSpeed;
  demo.lastTs = now;
  const R = st.fpl?.rows; if (!R || st.source !== 'demo') return;
  const steps = Math.ceil(dt / 0.1);
  dt /= steps;
  for (let s = 0; s < steps; s++) {
    demo.t += dt / 86400;
    if (demo.dwellUntil != null) {
      if (demo.t < demo.dwellUntil) { demo.v = 0; continue; }
      demo.dwellUntil = null;
    }
    const end = R[R.length - 1].laufweg;
    if (demo.weg >= end - 0.5) { demo.v = 0; continue; }
    // zulässige Geschwindigkeit an der Position und vorausschauend bremsen
    let j = 0; while (j < R.length - 1 && R[j + 1].laufweg <= demo.weg + 0.01) j++;
    let target = (R[j].vEff ?? 60) / 3.6 * 0.97;
    const b = 0.55;
    for (let k = j + 1; k < R.length; k++) {
      const d = R[k].laufweg - demo.weg; if (d > 4000) break;
      if (R[k].vEff != null && R[k].vChange) target = Math.min(target, Math.sqrt(Math.pow(R[k].vEff / 3.6 * 0.97, 2) + 2 * b * Math.max(0, d - 30)));
      if (R[k].halt) { target = Math.min(target, Math.sqrt(2 * b * Math.max(0, d - 1)) + (d > 3 ? 0.6 : 0)); break; }
    }
    if (demo.v < target) demo.v = Math.min(target, demo.v + 0.5 * dt);
    else demo.v = Math.max(target, demo.v - 0.9 * dt);
    demo.weg += demo.v * dt;
    // Halt erreicht?
    for (let k = j + 1; k < R.length; k++) {
      const d = R[k].laufweg - demo.weg; if (d > 10) break;
      if (R[k].halt && d <= 1.2 && demo.v < 2) {
        demo.weg = R[k].laufweg; demo.v = 0;
        demo.dwellUntil = R[k].abf != null ? Math.max(R[k].abf, demo.t + 25 / 86400) : null;
        if (R[k].abf == null) demo.dwellUntil = 1e9;
        break;
      }
    }
  }
  const L = st.live;
  L.v = demo.v; L.km = demoKm(demo.weg); L.time = demo.t - Math.floor(demo.t); L.date = Math.floor(demo.t); L.weg = demo.weg; L.at = Date.now();
  let j = 0; while (j < R.length - 1 && R[j + 1].laufweg <= demo.weg) j++;
  L.vStrecke = R[j].vEff != null ? R[j].vEff / 3.6 : null;
  updatePosition();
  render();
}

function setSource(src, restart, keepFpl) {
  if (src === st.source && !restart) return;
  stopDemo();
  if (src !== 'zusi') stopBridge();
  st.source = src;
  S.source = src; saveS();
  st.live = { v: null, km: null, time: null, date: null, weg: null, vStrecke: null, afb: null, at: 0 };
  st.manual = false; st.scroll = 0;
  if (src === 'demo') startDemo();
  else if (src === 'zusi') {
    if (st.fpl && st.fpl.origin === 'Demo') { st.fpl = null; buildView(); }
    startBridge();
    flash('Datenquelle: Zusi 3 über Bridge', '');
  } else {
    if (!keepFpl && st.fpl && st.fpl.origin === 'Demo') { st.fpl = null; buildView(); }
    st.pos.mode = 'manuell';
    flash('Offline – Fahrplandatei laden (Taste 3), Position mit V>0 / V=0', '');
  }
  render();
}

// Uhr im Offline-Modus: Echtzeit
setInterval(() => {
  if (st.source === 'offline') {
    const d = new Date();
    st.live.time = (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) / 86400;
    st.live.date = dayNum(d.getFullYear(), d.getMonth() + 1, d.getDate());
    if (st.fpl && !st.manual) updatePosition();
  }
  // Zusi ohne neue Daten: Uhr nicht einfrieren lassen (Server sendet nur Änderungen)
  render();
}, 1000);

// ------------------------------------------------------------ Start
async function detectBridge() {
  if (!location.protocol.startsWith('http') && !S.bridgeUrl) return false;
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(bridgeBase() + '/api/state', { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(to);
    const j = await r.json();
    return j.bridge === 'nussy-ebula';
  } catch (e) { return false; }
}

(async function init() {
  buildKeys();
  layout();
  render();
  let src = S.source;
  if (src === 'auto' || src === 'zusi') src = (await detectBridge()) ? 'zusi' : (src === 'zusi' ? 'zusi' : 'demo');
  setSource(src, true);
})();
