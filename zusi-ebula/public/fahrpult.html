<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Fahrpult für Zusi 3</title>
<style>
/* Farben nach dem ETCS-Fahrerdisplay (ERA), Hintergrund in DB-Blau */
:root {
  --bg: rgb(9, 38, 168); --line: rgb(30, 86, 222); --shadow: rgb(4, 18, 90);
  --white: #fff; --grey: rgb(195, 195, 195); --mgrey: rgb(150, 150, 150); --dgrey: rgb(85, 85, 85);
  --yellow: rgb(223, 223, 0); --orange: rgb(234, 145, 0); --red: rgb(191, 0, 2); --pzb: rgb(0, 72, 255);
  --zug: rgb(0, 0, 234); --brems: rgb(180, 180, 0); --seg: rgb(215, 215, 222);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
body { font-family: "FreeSans", Arial, "Helvetica Neue", Roboto, sans-serif; color: var(--grey); }
svg text { font-family: inherit; }

/* Arbeitsfläche in ETCS-Einheiten: Display 640 × 480, daneben 236 Einheiten für die Manometer */
#dev { position: absolute; left: 0; top: 0; width: 876px; height: 480px; transform-origin: 0 0; background: #000; }
#dev.off > * { visibility: hidden; }
#dmi { position: absolute; left: 0; top: 0; width: 640px; height: 480px; background: var(--bg); overflow: hidden; }
.f { position: absolute; border: 1px solid var(--line); box-shadow: inset 1px 1px 0 var(--shadow); display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
.zy { position: absolute; left: 0; width: 640px; height: 15px; background: var(--shadow); }
.btn { cursor: pointer; color: var(--grey); font-size: 17px; line-height: 1.1; }
.btn.small { font-size: 12px; }
.btn.pressed { background: var(--line); }
.val { font-size: 11px; line-height: 1.2; flex-direction: column; }
.val b { display: block; font-size: 15px; color: var(--white); font-weight: 700; }

/* Leuchtmelder (PZB/LZB): dunkel = leer, an = farbiges Symbol */
.lm { font-weight: 700; font-size: 13px; color: transparent; }
.lm span { display: inline-block; padding: 3px 3px; min-width: 28px; line-height: 1.15; }
.lm.on span { color: #000; }
.lm.y.on span { background: var(--yellow); }
.lm.r.on span { background: var(--red); color: #fff; }
.lm.b.on span { background: var(--pzb); color: #fff; font-size: 16px; min-width: 30px; }
.lm.w.on span { background: var(--white); }
.lm.g.on span { background: var(--grey); }
#lm-zb svg polygon { fill: none; stroke: var(--grey); stroke-width: 3; }
#lm-zb.on svg polygon { fill: var(--red); stroke: #fff; }

/* Meldungen (E5–E9) */
#msgs { justify-content: flex-start; align-items: flex-start; flex-direction: column; padding: 3px 6px; font-size: 13px; text-align: left; }
#msgs div { white-space: nowrap; line-height: 19px; color: var(--grey); }
#msgs div.err { color: var(--yellow); }
#msgs div i { font-style: normal; display: inline-block; width: 42px; }

/* Fenster (Menü, Diagnose, Verbindung) über A–D wie die ETCS-Datenfenster */
.win { position: absolute; left: 0; top: 15px; width: 580px; height: 450px; background: var(--bg); border: 1px solid var(--line); display: none; z-index: 3; }
.win.show { display: block; }
.win .tt { background: var(--grey); color: #000; font-size: 15px; height: 24px; line-height: 24px; padding-left: 6px; }
.win .body { padding: 8px; height: 424px; overflow: auto; font-size: 13px; }
#menulist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mi { border: 1px solid var(--line); box-shadow: inset 1px 1px 0 var(--shadow); padding: 8px; min-height: 42px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; }
.mi b { color: var(--white); }
.mi.pressed { background: var(--line); }
#diag table { border-collapse: collapse; width: 100%; }
#diag td { border-bottom: 1px solid var(--line); padding: 2px 4px; }
#diag pre { margin: 0; font-size: 10px; white-space: pre-wrap; word-break: break-all; color: var(--mgrey); }
#conn input { width: 100%; font: inherit; font-size: 17px; padding: 6px; margin: 8px 0; border: 1px solid var(--line); background: var(--shadow); color: var(--white); }
#conn .btns { display: flex; gap: 6px; flex-wrap: wrap; }
#conn button { flex: 1 1 120px; font-family: inherit; font-size: 14px; padding: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--grey); cursor: pointer; }
#c-st { color: var(--mgrey); min-height: 18px; }
#c-found button { display: block; width: 100%; margin-top: 6px; background: rgb(0, 105, 31); color: #fff; }
</style>
</head>
<body>
<div id="dev">
  <div id="dmi">
    <div class="zy" style="top:0"></div><div class="zy" style="top:465px"></div>
    <div id="fields"></div>
    <div class="win" id="menu"><div class="tt">Hauptmenü</div><div class="body"><div id="menulist"></div></div></div>
    <div class="win" id="diag"><div class="tt">Diagnose <small>– antippen zum Schließen</small></div><div class="body" id="diagbody"></div></div>
    <div class="win" id="conn"><div class="tt">Verbindung zur Bridge</div><div class="body">
      <div>Adresse aus dem start.bat-Fenster, z. B. 192.168.178.21:8080</div>
      <input id="c-addr" placeholder="192.168.178.21:8080" inputmode="url" autocomplete="off">
      <div id="c-st"></div>
      <div class="btns"><button data-c="ok">Verbinden</button><button data-c="scan">Im WLAN suchen</button><button data-c="demo">Demo</button><button data-c="close">Abbrechen</button></div>
      <div id="c-found"></div>
    </div></div>
  </div>
  <svg id="mano" width="236" height="480" viewBox="0 0 236 480" style="position:absolute;left:640px;top:0"></svg>
</div>

<script src="sound.js"></script>
<script>
'use strict';
/* =====================================================================
   Nussy Fahrpult – Führerstandsdisplay nach dem Aufbau des ETCS-Fahrerdisplays (ERA, 640 × 480)
   mit PZB/LZB-Meldern und Manometern, Daten: Zusi 3 → bridge.js → Server-Sent Events
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const START = (() => { try { return window.NussyApp && window.NussyApp.startPage ? window.NussyApp.startPage() : ''; } catch (e) { return ''; } })();
const OWN_APP = START === 'fahrpult.html'; // eigene Fahrpult-App: kein Wechsel zur EBuLa

// Einstellungen: Bridge-Adresse und Töne wie in der EBuLa (gleicher Speicher), Anzeige eigene
const E = { bridgeUrl: '', sound: true, vol: 70, meldeton: true, vibra: true };
try { Object.assign(E, JSON.parse(localStorage.getItem('ebula-settings') || '{}')); } catch (e) { /* privat */ }
function saveE() { try { const o = JSON.parse(localStorage.getItem('ebula-settings') || '{}'); Object.assign(o, { bridgeUrl: E.bridgeUrl, sound: E.sound, vol: E.vol }); localStorage.setItem('ebula-settings', JSON.stringify(o)); } catch (e) { /* egal */ } }
const F = { bright: 100, vmax: 400, fmax: 0, cab: true };
try { Object.assign(F, JSON.parse(localStorage.getItem('fahrpult-settings') || '{}')); } catch (e) { /* privat */ }
if (![400, 250, 180].includes(F.vmax)) F.vmax = 400;
function saveF() { try { localStorage.setItem('fahrpult-settings', JSON.stringify(F)); } catch (e) { /* egal */ } }
// 100 % Zugkraft lernt sich je Fahrzeug selbst ein (größte gesehene Kraft), wenn F.fmax = 0 (automatisch)
let FMAX = {};
try { FMAX = JSON.parse(localStorage.getItem('fahrpult-fmax') || '{}'); } catch (e) { /* privat */ }

const st = { win: null, source: null, booting: true, bridge: false, zusi: false, zug: '', zugdatei: '', log: [], logPos: 0, off: false, d: {}, at: 0, muted: new Set() };
const SND = EbulaSound(() => ({ sound: E.sound, vol: E.vol, meldeton: E.meldeton, vibra: E.vibra, quiet: st.booting, cab: F.cab }));

/* Zusi-3-TCP: Status Sifa (0x0064) und Status Zugbeeinflussung (0x0065) ▸ Betriebsdaten (0x0003).
   Melderwerte: 0 aus, 1 an, 2 blinkend, 3 gegenläufig blinkend (Wechselblinken 70/85), 4 aus erzwingend. */
const SIFA = { node: 0x64, lm: 2, hupe: 3 };
const ZB = {
  node: 0x65, betrieb: 3, zwang: 3, bild: 0x0C, lzbVs: 0x21, lzbVz: 0x22, lzbZw: 0x23,
  m1000: 0x2F, o85: 0x30, m70: 0x31, u55: 0x32, m500: 0x33, befehl: 0x34,
  G: 0x24, H: 0x38, E40: 0x39, Ende: 0x3A, B: 0x3B, Ue: 0x3C, EL: 0x3D, V40: 0x3E, S: 0x3F,
};

// ------------------------------------------------------------------ Felder des Displays (ETCS-Koordinaten)
const FIELDS = [
  // A: Zielweg (A2 Ziffern, A3 Balken), A1/A4 leer
  ['A1', 0, 15, 54, 54], ['A2', 0, 69, 54, 30, 'val'], ['A3', 0, 99, 54, 191], ['A4', 0, 290, 54, 25],
  // B: Tacho
  ['B', 54, 15, 280, 300],
  // C: Melder unter dem Tacho
  ['C8', 0, 315, 54, 25, 'lm w'], ['C9', 0, 340, 54, 25, 'val'],
  ['C2', 54, 315, 37, 50, 'lm b'], ['C3', 91, 315, 37, 50, 'lm b'], ['C4', 128, 315, 37, 50, 'lm b'],
  ['C1', 165, 315, 58, 50, 'lm y'], ['C5', 223, 315, 37, 50, 'lm r'], ['C6', 260, 315, 37, 50, 'lm w'], ['C7', 297, 315, 37, 50, 'lm'],
  // D: Zug-/Bremskraft
  ['D', 334, 15, 246, 300],
  // E: Status links, Meldungen, Blättern
  ['E1', 0, 365, 54, 25, 'val'], ['E2', 0, 390, 54, 25, 'val'], ['E3', 0, 415, 54, 25, 'val'], ['E4', 0, 440, 54, 25, 'val'],
  ['E5', 54, 365, 234, 100], ['E10', 288, 365, 46, 50, 'btn'], ['E11', 288, 415, 46, 50, 'btn'],
  // F: Tasten
  ['F1', 580, 15, 60, 50, 'btn'], ['F2', 580, 65, 60, 50, 'btn small'], ['F3', 580, 115, 60, 50, 'btn small'], ['F4', 580, 165, 60, 50, 'btn small'],
  ['F5', 580, 215, 60, 50, 'btn'], ['F6', 580, 265, 60, 50], ['F7', 580, 315, 60, 50], ['F8', 580, 365, 60, 50], ['F9', 580, 415, 60, 50],
  // G: LZB-Melder, Werte, Uhr
  ...[0, 1, 2, 3, 4].map((i) => [`G${i + 1}`, 334 + i * 49.2, 315, 49.2, 50, 'lm g']),
  ...[0, 1, 2, 3, 4].map((i) => [`G${i + 6}`, 334 + i * 49.2, 365, 49.2, 50, i === 4 ? 'val' : 'lm g']),
  ['G11', 334, 415, 63, 50, 'val'], ['G12', 397, 415, 120, 50, 'val'], ['G13', 517, 415, 63, 50, 'val'],
];
function buildFields() {
  $('fields').innerHTML = FIELDS.map(([id, x, y, w, h, cls]) => `<div class="f ${cls || ''}" id="f-${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`).join('');
  // Melder-Beschriftungen und Tasten
  const set = (id, html) => { $('f-' + id).innerHTML = html; };
  set('C2', '<span>85</span>'); set('C3', '<span>70</span>'); set('C4', '<span>55</span>');
  set('C1', '<span>1000 Hz</span>'); set('C5', '<span>500 Hz</span>'); set('C6', '<span>Bef 40</span>');
  set('C7', '<svg width="34" height="34" viewBox="0 0 34 34"><polygon points="11,2 23,2 32,11 32,23 23,32 11,32 2,23 2,11"/></svg>'); $('f-C7').id = 'lm-zb';
  set('C8', '<span>Sifa</span>');
  const LZB = ['G', 'B', 'Ü', 'Ende', 'H', 'E40', 'EL', 'V40', 'S'];
  ['G1', 'G2', 'G3', 'G4', 'G5', 'G6', 'G7', 'G8', 'G9'].forEach((g, i) => set(g, `<span>${LZB[i]}</span>`));
  set('F1', 'Menü'); set('F2', 'Ton<br>quitt.'); set('F5', '<svg width="30" height="30" viewBox="0 0 24 24"><path fill="currentColor" d="M22.7 19.3l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6.3 6.3 9 2 4.7C.9 7.1 1.4 10.1 3.3 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2-2c.5-.4.5-1.1 0-1.4z"/></svg>');
  set('E10', '<svg width="26" height="22" viewBox="0 0 26 22"><path d="M13 1 L25 21 L1 21 Z" fill="var(--grey)"/></svg>');
  set('E11', '<svg width="26" height="22" viewBox="0 0 26 22"><path d="M13 21 L25 1 L1 1 Z" fill="var(--grey)"/></svg>');
  for (const [id, k] of [['F1', 'menu'], ['F2', 'quitt'], ['F5', 'diag'], ['E10', 'up'], ['E11', 'down']]) $('f-' + id).dataset.k = k;
  $('f-E5').id = 'msgs';
  $('f-B').innerHTML = '<svg id="tacho" width="280" height="300" viewBox="0 0 280 300"></svg>';
  $('f-D').innerHTML = '<svg id="kraft" width="246" height="300" viewBox="0 0 246 300"></svg>';
  $('f-A3').innerHTML = '<svg id="zielweg" width="54" height="191" viewBox="0 0 54 191"></svg>';
}

// ------------------------------------------------------------------ SVG-Hilfen
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const rad = (deg) => deg * Math.PI / 180;
const polar = (cx, cy, r, deg) => [cx + r * Math.sin(rad(deg)), cy - r * Math.cos(rad(deg))];
function arcPath(cx, cy, r, a0, a1) {
  if (a1 - a0 < 0.05) return '';
  const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`;
}
function sector(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => polar(cx, cy, r, a).map((n) => n.toFixed(2)).join(',');
  return `M${p(r1, a0)} A${r1},${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0},${r0} 0 0 0 ${p(r0, a0)} Z`;
}

// ------------------------------------------------------------------ Tacho (Feld B)
/* ETCS-Skala: 288° Bogen ab −144°. Skala 400: 0–200 km/h auf 192°, 200–400 auf 96°; Skalen 250 und 180 linear. */
const TS = {
  400: { ang: (v) => -144 + (v < 200 ? v / 200 * 192 : 192 + (v - 200) / 200 * 96), max: 400, labels: [0, 50, 100, 150, 200, 300, 400], long: 50, short: 10 },
  250: { ang: (v) => -144 + v / 250 * 288, max: 250, labels: [0, 50, 100, 150, 200, 250], long: 50, short: 10 },
  180: { ang: (v) => -144 + v / 180 * 288, max: 180, labels: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180], long: 20, short: 10 },
};
const T = { cx: 140, cy: 150, rTick: 125, rRing: 131, rHub: 25 };
let tS = null, tEl = {}, needle = { pos: -144, dest: -144 };
function buildTacho() {
  tS = TS[F.vmax];
  const s = $('tacho'); s.innerHTML = ''; tEl = {};
  const A = tS.ang;
  // Ring der erlaubten Geschwindigkeit (CSG) und Zielgeschwindigkeit, darüber die Haken
  tEl.ringT = el('path', { d: '', fill: 'none', stroke: 'var(--dgrey)', 'stroke-width': 9 }, s);
  tEl.ring = el('path', { d: '', fill: 'none', stroke: 'var(--grey)', 'stroke-width': 9 }, s);
  for (let v = 0; v <= tS.max + 0.01; v += tS.short) {
    const big = v % tS.long === 0, [x0, y0] = polar(T.cx, T.cy, T.rTick, A(v)), [x1, y1] = polar(T.cx, T.cy, T.rTick - (big ? 25 : 15), A(v));
    el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: 'var(--white)', 'stroke-width': big ? 3.5 : 2 }, s);
  }
  for (const v of tS.labels) {
    const [x, y] = polar(T.cx, T.cy, T.rTick - 41, A(v));
    el('text', { x, y: y + 6.5, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: 'var(--white)' }, s).textContent = v;
  }
  tEl.hookT = el('rect', { x: -5, y: -(T.rRing + 10), width: 10, height: 20, fill: 'var(--mgrey)', visibility: 'hidden' }, s);
  tEl.hook = el('rect', { x: -5, y: -(T.rRing + 10), width: 10, height: 20, fill: 'var(--grey)', visibility: 'hidden' }, s);
  tEl.vset = el('circle', { cx: 0, cy: -(T.rRing), r: 5, fill: 'var(--white)', visibility: 'hidden' }, s);
  tEl.needle = el('path', { d: `M-4,-${T.rHub - 4} L-4,-${T.rTick - 22} L0,-${T.rTick - 6} L4,-${T.rTick - 22} L4,-${T.rHub - 4} Z`, fill: 'var(--grey)', visibility: 'hidden' }, s);
  tEl.hub = el('circle', { cx: T.cx, cy: T.cy, r: T.rHub, fill: 'var(--grey)' }, s);
  tEl.digit = el('text', { x: T.cx + 17, y: T.cy + 8, 'text-anchor': 'end', 'font-size': 23, 'font-weight': 700, fill: '#000' }, s);
  // LZB-Zielgeschwindigkeit unten links im Feld B
  tEl.vziel = el('text', { x: 30, y: 288, 'text-anchor': 'start', 'font-size': 17, 'font-weight': 700, fill: 'var(--grey)' }, s);
}
function hookAt(e, v) { e.setAttribute('transform', `translate(${T.cx},${T.cy}) rotate(${tS.ang(v).toFixed(2)})`); e.setAttribute('visibility', 'visible'); }

// ------------------------------------------------------------------ Zug-/Bremskraft in % (Feld D)
const K = { cx: 123, cy: 128, r0: 82, r1: 108 };
let kSeg = [], kTri = null, kTxt = null;
function buildKraft() {
  const s = $('kraft'); s.innerHTML = ''; kSeg = [];
  // je Seite 10 Segmente zu 10 %: 0 % oben, 100 % unten links (Bremsen) bzw. rechts (Fahren), 150° je Seite
  for (const side of [-1, 1]) {
    for (let i = 0; i < 10; i++) {
      const a0 = side * (i * 15 + 0.8), a1 = side * ((i + 1) * 15 - 0.8);
      kSeg.push({ side, i, p: el('path', { d: sector(K.cx, K.cy, K.r0, K.r1, Math.min(a0, a1), Math.max(a0, a1)), fill: 'var(--seg)' }, s) });
    }
    for (let v = 20; v <= 100; v += 20) {
      const [x, y] = polar(K.cx, K.cy, K.r0 - 17, side * v * 1.5);
      el('text', { x, y: y + 6, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: 'var(--white)' }, s).textContent = v;
    }
  }
  el('text', { x: K.cx, y: K.cy - K.r0 + 25, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: 'var(--white)' }, s).textContent = '0';
  el('text', { x: K.cx, y: K.cy + 11, 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 700, fill: 'var(--white)' }, s).textContent = '%';
  el('text', { x: K.cx - 6, y: K.cy + 110, 'text-anchor': 'end', 'font-size': 13, 'font-weight': 700, fill: 'var(--white)' }, s).textContent = 'Bremsen';
  el('text', { x: K.cx + 6, y: K.cy + 110, 'text-anchor': 'start', 'font-size': 13, 'font-weight': 700, fill: 'var(--white)' }, s).textContent = 'Fahren';
  el('rect', { x: K.cx - 2, y: K.cy + 92, width: 4, height: 44, fill: 'var(--white)' }, s);
  kTri = el('path', { d: 'M0,0 L-7,-11 L7,-11 Z', fill: 'var(--grey)' }, s);
  kTxt = el('text', { x: K.cx, y: 290, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--mgrey)' }, s);
}

// ------------------------------------------------------------------ Zielwegbalken (Feld A3, DB-Darstellung bis 4000 m)
let zwBar = null;
function buildZielweg() {
  const s = $('zielweg'); s.innerHTML = '';
  for (let m = 0; m <= 4000; m += 500) {
    const y = 180 - m / 4000 * 165, big = m % 1000 === 0;
    el('line', { x1: big ? 6 : 10, y1: y, x2: 16, y2: y, stroke: 'var(--grey)', 'stroke-width': 1.5 }, s);
    if (big) el('text', { x: 4, y: y - 2, 'font-size': 8, fill: 'var(--grey)' }, s).textContent = m / 1000;
  }
  zwBar = el('rect', { x: 24, y: 180, width: 12, height: 0, fill: 'var(--grey)' }, s);
}

// ------------------------------------------------------------------ Manometer (rechts, auf Schwarz)
const GA = [
  { cy: 120, max: 12, knots: [[0, -140], [1, -118], [2, -95], [3, -62], [4, -28], [5, 0], [6, 25], [7, 47], [8, 68], [9, 88], [10, 104], [11, 120], [12, 135]],
    needles: [{ id: 4, color: 'rgb(255,40,25)', label: 'Hauptluftbehälter' }, { id: 2, color: 'rgb(240,232,40)', label: 'Hauptluftleitung' }] },
  { cy: 362, max: 10, knots: [[0, -140], [1, -117], [2, -92], [3, -57], [4, -22], [5, 0], [6, 25], [7, 52], [8, 78], [9, 102], [10, 125]],
    needles: [{ id: 3, color: 'rgb(240,232,40)', label: 'Bremszylinder' }] },
];
const GC = { cx: 118, r: 102 };
function scaleFn(knots) {
  return (v) => {
    for (let i = 1; i < knots.length; i++) { const [v1, a1] = knots[i], [v0, a0] = knots[i - 1]; if (v <= v1) return a0 + (a1 - a0) * (Math.max(v, v0) - v0) / (v1 - v0); }
    return knots[knots.length - 1][1];
  };
}
function buildMano() {
  const s = $('mano'); s.innerHTML = '';
  for (const g of GA) {
    g.ang = scaleFn(g.knots);

  // ---- Manometer
  for (const g of GA) for (const n of g.needles) {
    const p = val(n.id);
    n.el.setAttribute('visibility', p == null ? 'hidden' : 'visible');
    n.el.setAttribute('transform', `translate(${GC.cx},${g.cy}) rotate(${g.ang(clamp(p || 0, 0, g.max)).toFixed(2)})`);
  }
  // ---- Melder: PZB (C), Sifa (C8), Zwangsbremsung (C7), LZB (G)
  const restr = isRestriktiv(z);
  lamp('f-C2', z.o85 === 2 && !restr ? 2 : z.o85); lamp('f-C3', restr && z.m70 !== 3 ? 3 : z.m70); lamp('f-C4', z.u55);
  lamp('f-C1', z.m1000); lamp('f-C5', z.m500); lamp('f-C6', z.befehl);
  lamp('f-C8', z.sifaHupe ? 2 : z.sifa);
  $('f-C8').classList.toggle('y', !!z.sifaHupe); $('f-C8').classList.toggle('w', !z.sifaHupe);
  $('lm-zb').classList.toggle('on', !!z.zwang);
  ['G', 'B', 'Ue', 'Ende', 'H', 'E40', 'EL', 'V40', 'S'].forEach((k, i) => lamp('f-G' + (i + 1), z[k]));
  // ---- Werte und Status
  const hs = val(0x13) != null ? val(0x13) > 0.5 : null;
  $('f-C9').innerHTML = hs == null ? '' : `<span style="color:${hs ? 'var(--grey)' : 'var(--yellow)'}">HS ${hs ? 'ein' : 'aus'}</span>`;
  $('f-E1').innerHTML = `<span style="color:${st.source === 'demo' ? 'var(--grey)' : st.zusi ? 'rgb(0,200,70)' : 'var(--yellow)'}">${st.source === 'demo' ? 'Demo' : st.zusi ? 'Zusi' : st.bridge ? 'Zusi?' : 'Bridge?'}</span>`;
  $('f-E2').innerHTML = live ? (z.lzb ? 'LZB' : 'PZB') : '';
  $('f-E3').innerHTML = afb != null ? `AFB ${Math.round(afb)}` : '';
  $('f-E4').innerHTML = val(0x15) != null ? `Fst ${Math.round(val(0x15))}` : '';
  $('f-G10').innerHTML = vs != null ? `V Str.<b>${Math.round(vs)}</b>` : '';
  $('f-G11').innerHTML = f != null ? `${f < 0 ? 'Bremse' : 'Zug'} kN<b>${Math.abs(Math.round(f))}</b>` : '';
  const u = val(0x0E), i = val(0x0D);
  $('f-G12').innerHTML = (st.zug ? `Zug ${esc(st.zug)}<br>` : '') + (u != null ? `${fmt(u > 100 ? u / 1000 : u, 1)} kV` : '') + (i != null ? ` · ${Math.round(i)} A` : '');
  const tod = val(0x23);
  if (tod != null) { const s = Math.round(tod * 86400) % 86400, p = (n) => String(n).padStart(2, '0'); $('f-G13').innerHTML = `<b>${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}</b>`; }
  else $('f-G13').innerHTML = '<b>--:--:--</b>';
  // ---- Meldungen (E5–E9): fünf Zeilen ab der Blätterposition
  const idle = st.source === 'demo' ? '' : !st.bridge ? 'Keine Verbindung zur Bridge – Menü ▸ Bridge-Verbindung' : !st.zusi ? 'Warte auf Zusi 3 …' : '';
  const L = st.log.slice(st.logPos, st.logPos + 5);
  $('msgs').innerHTML = L.length ? L.map((m) => `<div class="${m.cls === 'err' ? 'err' : ''}"><i>${m.t}</i>${esc(m.text)}</div>`).join('') : `<div class="err">${esc(idle)}</div>`;
  if (st.win === 'diag') renderDiag(d, z);
}
// Nadel gedämpft nachführen (wie ein Zeigerinstrument)
setInterval(() => {
  if (!tEl.needle) return;
  const diff = needle.dest - needle.pos;
  if (Math.abs(diff) < 0.05) needle.pos = needle.dest; else needle.pos += diff * 0.35;
  tEl.needle.setAttribute('transform', `translate(${T.cx},${T.cy}) rotate(${needle.pos.toFixed(2)})`);
}, 40);

const NAMES = { 1: 'Geschwindigkeit m/s', 2: 'Druck HL bar', 3: 'Druck Bremszylinder bar', 4: 'Druck HBL bar', 9: 'Zugkraft gesamt N', 11: 'Zugkraft-Soll N',
  13: 'Oberstrom A', 14: 'Fahrleitungsspannung V', 19: 'Hauptschalter', 21: 'Fahrstufe', 23: 'AFB-Soll m/s', 35: 'Uhrzeit', 77: 'Streckenhöchstgeschw. m/s' };
function renderDiag(d, z) {
  const w = (v) => ['aus', 'an', 'blinkt', 'blinkt gegenläufig'][v] || String(v);
  $('diagbody').innerHTML = `<div style="display:flex;gap:10px"><div style="flex:1">${st.log.map((l) => `<div>${l.t}  ${esc(l.text)}</div>`).join('') || 'Keine Meldungen'}</div>
    <div style="flex:1"><table>${Object.keys(NAMES).map((id) => `<tr><td>0x${(+id).toString(16).padStart(4, '0').toUpperCase()}</td><td>${NAMES[id]}</td><td style="text-align:right">${d[id] != null ? (+d[id]).toFixed(2) : '–'}</td></tr>`).join('')}</table></div></div>
    <p><b>PZB gedeutet:</b> 85: ${w(z.o85)} · 70: ${w(z.m70)} · 55: ${w(z.u55)} · 1000 Hz: ${w(z.m1000)} · 500 Hz: ${w(z.m500)} · Befehl: ${w(z.befehl)} · restriktiv: ${isRestriktiv(z) ? 'ja' : 'nein'} · Zwangsbremsung: ${z.zwang ? 'ja' : 'nein'}<br>
    <b>LZB:</b> ${z.lzb ? `Soll ${z.lzbVs != null ? Math.round(z.lzbVs) : '–'} · Ziel ${z.lzbVz != null ? Math.round(z.lzbVz) : '–'} · Zielweg ${z.lzbZw != null ? Math.round(z.lzbZw) + ' m' : '–'}` : 'nicht aktiv'}
    · G ${w(z.G)} · B ${w(z.B)} · Ü ${w(z.Ue)} · Ende ${w(z.Ende)} · H ${w(z.H)} · E40 ${w(z.E40)} · EL ${w(z.EL)} · V40 ${w(z.V40)} · S ${w(z.S)}<br>
    <b>Sifa:</b> Melder ${w(z.sifa)}, Hupe ${z.sifaHupe}</p>
    <b>Rohdaten</b><pre>${esc(JSON.stringify(d.nodes || {}))}</pre>`;
}

// ------------------------------------------------------------------ Verbindungsdialog
function openConn() { openWin('conn'); $('c-addr').value = (E.bridgeUrl || '').replace(/^https?:\/\//, ''); $('c-st').textContent = ''; $('c-found').innerHTML = ''; }
function normAddr(a) {
  a = String(a || '').trim(); if (!a) return '';
  if (!/^https?:\/\//i.test(a)) a = 'http://' + a;
  try { const u = new URL(a); if (!u.port && u.protocol === 'http:') u.port = '8080'; return u.origin; } catch (e) { return null; }
}
async function probe(base, ms) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms);
  try { const j = await (await fetch(base + '/api/state', { signal: ctl.signal, cache: 'no-store' })).json(); return j.bridge === 'nussy-ebula'; }
  catch (e) { return false; } finally { clearTimeout(to); }
}
let scanAbort = false;
async function connAction(c, addr) {
  const status = $('c-st');
  if (c === 'close') { scanAbort = true; return openWin(null); }
  if (c === 'demo') { scanAbort = true; openWin(null); setSource('demo'); return; }
  if (c === 'ok') {
    const a = addr || normAddr($('c-addr').value);
    if (a === null) { status.textContent = 'Ungültige Adresse'; return; }
    if (a === '' && !location.protocol.startsWith('http')) { status.textContent = 'Bitte die Adresse der Bridge eingeben'; return; }
    status.textContent = 'Verbinde …';
    if (!(await probe(a, 3000))) { status.textContent = 'Keine Bridge erreichbar. Läuft start.bat? Selbes WLAN? Firewall?'; return; }
    E.bridgeUrl = a; saveE(); scanAbort = true; openWin(null); setSource('zusi');
    return;
  }
  if (c === 'scan') {
    scanAbort = false;
    let ip = null;
    try { ip = window.NussyApp && window.NussyApp.getLocalIp ? window.NussyApp.getLocalIp() : null; } catch (e) { /* kein App-Interface */ }
    const prefixes = ip && /^\d+\.\d+\.\d+\.\d+$/.test(ip) ? [ip.split('.').slice(0, 3).join('.')] : ['192.168.178', '192.168.0', '192.168.1', '192.168.2', '10.0.0'];
    const found = [];
    for (const pre of prefixes) {
      const hosts = Array.from({ length: 254 }, (_, i) => `${pre}.${i + 1}`);
      let done = 0;
      const worker = async () => {
        while (hosts.length && !scanAbort) {
          const base = `http://${hosts.shift()}:8080`;
          if (await probe(base, 1500)) { found.push(base); $('c-found').innerHTML = found.map((x) => `<button data-c="ok" data-addr="${x}">Verbinden mit ${x.replace('http://', '')}</button>`).join(''); }
          status.textContent = `Suche in ${pre}.x … ${++done}/254`;
        }
      };
      await Promise.all(Array.from({ length: 48 }, worker));
      if (found.length || scanAbort) break;
    }
    if (!scanAbort) status.textContent = found.length ? 'Bridge gefunden – antippen zum Verbinden' : 'Keine Bridge gefunden – Adresse bitte eingeben';
  }
}

// ------------------------------------------------------------------ Skalierung und Start
function layout() {
  const s = Math.min(window.innerWidth / 876, window.innerHeight / 480);
  $('dev').style.transform = `translate(${(window.innerWidth - 876 * s) / 2}px, ${(window.innerHeight - 480 * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
let wakeLock = null;
async function requestWakeLock() {
  if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { /* nicht erlaubt */ }
}

buildFields(); buildTacho(); buildKraft(); buildZielweg(); buildMano(); layout(); render();
SND.play('on');
setTimeout(() => {
  st.booting = false;
  setSource(new URLSearchParams(location.search).has('demo') || bridgeBase() == null ? 'demo' : 'zusi');
}, 600);
setInterval(render, 250); // auch für den Blinktakt der Melder
</script>
